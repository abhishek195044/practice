
<html lang="en">
<head>


    <title>SIMPLE FORM</title>
</head>
<body>
    <h3>simple registration form</h3> 
    <form>
        <table>
            <tr>
                <td>NAME:</td>
                <td>
             <input type="text"  pattern="[A-Z]+" title="Please enter only Alphabets"required><br><br>
                </td>
            </tr>
            <tr>
                <td>CONTACT:</td>
                <td>
          <input type="tel"  pattern="[0-9]{10}" title="Please enter only 10-digit number" maxlength="10"         required><br><br>
                </td>
            </tr>
            <tr>
			
			<td>E Mail</td>
			  <td>
             <input type="text"  pattern="[A-Z]+" title="Please enter only Alphabets"required><br><br>
                </td>
			</tr>
			
			<tr>
                <td>GENDER:</td>
                <td>
                    <input type="radio" name="gender"> M
                    <input type="radio" name="gender"> F
					<input type="radio" name="gender"> Trans
                </td>
            </tr>
            <tr>
			
               <td>Languages known:</td>
            <td>
                <input type="checkbox"> ENGLISH
                <input type="checkbox"> HINDI
				<input type="checkbox"> BHOJPURI
                <input type="checkbox"> TELUGU
                <input type="checkbox"> KANNADA
            </td>
            </tr>
            <tr>
			
			<td>programing Languages</td>
			<td>
			<input type="checkbox"> C Language
                <input type="checkbox"> Pythone
				<input type="checkbox"> JAVA
                <input type="checkbox"> HTML
				<input type="checkbox"> CSS
				</td>
				</tr>
			
                <td>HIGHEST QUALIFICATION:</td>
                <td>
                    <select>
                        <option>NOT APPLICABLE</option>
                        <option>SSC</option>
                        <option>INTER</option>
                        <option>GRADUATION</option>
                        <OPtion>POST GRADUATION</OPtion>
						<option> NOTHING FOR WORK   </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>ADDRESS:</td>
                <td>
              <textarea  cols="20" rows="10"></textarea>
                </td>
            </tr>
            <tr>
                <td>
				<input type="FILE" placeholder="submit">
              <input type="submit" placeholder="submit">
               <input type="reset" placeholder="reset">
                </td>
            </tr>
        </table>
    </form> 
</body>
</html>
