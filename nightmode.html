<!DOCTYPE html>
<html>
<head>
    <title>Day Night Mode</title>

    <style>
        body {
            background-color: white;
            color: black;
            text-align: center;
            font-family: Arial;
        }

        .dark {
            background-color: black;
            color: white;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Welcome</h1>
    <p>This is my website.</p>

    <button onclick="changeMode()">🌙 Night Mode</button>

    <script>
        function changeMode() {
            document.body.classList.toggle("dark");

            if (document.body.classList.contains("dark")) {
                document.querySelector("button").innerHTML = "☀️ Day Mode";
            } else {
                document.querySelector("button").innerHTML = "🌙 Night Mode";
            }
        }
    </script>

</body>
</html>
