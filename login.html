<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .login-container{
            background:#fff;
            padding:40px;
            width:350px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        .login-container h2{
            margin-bottom:20px;
            color:#333;
        }

        .input-group{
            margin-bottom:15px;
            text-align:left;
        }

        .input-group label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
            color:#555;
        }

        .input-group input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        .login-btn{
            width:100%;
            padding:12px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#008cff;
        }

        .links{
            margin-top:15px;
            font-size:14px;
        }

        .links a{
            color:#4facfe;
            text-decoration:none;
        }

        .links a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <form action="#">
        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <div class="links">
            <p><a href="#">Forgot Password?</a></p>
            <p>Don't have an account? <a href="#">Sign Up</a></p>
        </div>
    </form>
</div>

</body>
</html>
